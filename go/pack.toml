#:schema https://raw.githubusercontent.com/brainrc/brainrc/main/docs/schemas/pack.toml.schema.json
# brainrc/go, an official pack: Go services and database migrations. See README.md.
name = "go"
prefix = "brainrc-"
id = "brainrc/go"
description = "Go services and database migrations"
requires_core = ">=0.8, <0.9"  # installing it from brainrc/packs needs `subdir` (#121)
max_always_tokens = 200  # rules and descriptions every session loads
test = "tests"  # tests that `brainrc validate --pack` runs

[[extensions.gatework.domains]]  # a row for Gatework's Domains table
files = "`*.go`, `go.mod`"
skills = ["brainrc-go-service"]

[[extensions.gatework.domains]]  # a row for Gatework's Domains table
files = "migrations dirs, `*.sql`, ORM models"
skills = ["brainrc-db-migrations"]
reviewer = "brainrc-infra-reviewer"
