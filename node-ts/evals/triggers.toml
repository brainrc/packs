# Requests and the skills a model should load (expect) or must not load (forbid).
# brainrc merges this file into `scripts/evals.py triggers` when the pack is enabled.

[[case]]
prompt = "Type the fetchUser function in src/api.ts and fix the lint errors."
expect = ["brainrc-node-ts"]
forbid = ["brainrc-python", "brainrc-rust"]

[[case]]
prompt = "Add a pytest fixture for the database."
expect = []
forbid = ["brainrc-node-ts"]
