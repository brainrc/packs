# Requests and the skills a model should load (expect) or must not load (forbid).
# brainrc merges this file into `scripts/evals.py triggers` when the pack is enabled.

[[case]]
prompt = "Return a Result instead of panicking in src/parser.rs."
expect = ["brainrc-rust"]
forbid = ["brainrc-python", "brainrc-node-ts"]

[[case]]
prompt = "Add a Go handler for /healthz."
expect = []
forbid = ["brainrc-rust"]
