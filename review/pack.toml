#:schema https://raw.githubusercontent.com/brainrc/brainrc/main/docs/schemas/pack.toml.schema.json
# brainrc/review, an official pack: review, PR description, commit message and unslop. See README.md.
name = "review"
prefix = "brainrc-"
id = "brainrc/review"
description = "review, PR description, commit message and unslop"
requires_core = ">=0.8, <0.9"  # installing it from brainrc/packs needs `subdir` (#121)
max_always_tokens = 300  # rules and descriptions every session loads
test = "tests"  # tests that `brainrc validate --pack` runs
