# Requests and the skills a model should load (expect) or must not load (forbid).
# brainrc merges this file into `scripts/evals.py triggers` when the pack is enabled.

[[case]]
prompt = "Write a PR title and description for this branch."
expect = ["brainrc-pr-description"]
forbid = ["brainrc-commit-message"]

[[case]]
prompt = "Write a commit message for what I've staged."
expect = ["brainrc-commit-message"]
forbid = ["brainrc-pr-description"]

[[case]]
prompt = "Unslop this README section before I publish it."
expect = ["brainrc-unslop"]
forbid = ["brainrc-review"]

[[case]]
prompt = "Add a retry with backoff to the HTTP client."
expect = []
forbid = ["brainrc-unslop", "brainrc-pr-description", "brainrc-commit-message"]
