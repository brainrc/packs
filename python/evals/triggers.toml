# Requests and the skills a model should load (expect) or must not load (forbid).
# brainrc merges this file into `scripts/evals.py triggers` when the pack is enabled.

[[case]]
prompt = "Add a --json flag to the report command in src/app/cli.py and test it."
expect = ["brainrc-python"]
forbid = ["brainrc-node-ts", "brainrc-rust"]

[[case]]
prompt = "Bump the TypeScript target in tsconfig.json."
expect = []
forbid = ["brainrc-python"]
